# 8star-prep. Start with: docker compose up -d --build
# Copy .env.example to .env first and fill in the required values.
services:
  8star-prep:
    build: .
    image: 8star-prep:local
    container_name: 8star-prep
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Amsterdam}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-nl}
    volumes:
      - prep-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  prep-data:
